{% extends "base.html" %}
{% import "_macros.html" as ui %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="panel error-page" data-testid="error-state">
  <span class="empty-icon">{{ ui.icon("alert") }}</span>
  <h1>{{ title }}</h1>
  <p>{{ detail }}</p>
  <div class="actions">
    <a class="btn" href="/">Back to runs</a>
    <a class="btn subtle" href="/contracts">Browse contracts</a>
  </div>
</section>
{% endblock %}
