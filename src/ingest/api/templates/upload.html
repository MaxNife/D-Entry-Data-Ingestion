{% extends "base.html" %}
{% block title %}Upload · Ingest Platform{% endblock %}
{% block content %}
<section class="panel">
  <h2>Upload a file</h2>
  <form action="/upload" method="post" enctype="multipart/form-data">
    <label>File (CSV/Excel) <input type="file" name="file" required></label>
    <label>Contract
      <select name="contract">{% for n,v in contracts %}<option value="{{ n }}@v{{ v }}">{{ n }}@v{{ v }}</option>{% endfor %}</select>
    </label>
    <button type="submit">Ingest</button>
  </form>
</section>
{% endblock %}
