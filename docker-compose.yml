services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ingest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      INGEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ingest
      INGEST_UPLOAD_DIR: /app/data/uploads
      INGEST_CONTRACTS_DIR: /app/contracts
      INGEST_CHUNK_SIZE: 10000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./contracts:/app/contracts:ro
    command: ["uvicorn", "ingest.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
